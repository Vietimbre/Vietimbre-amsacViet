name: Tạo âm thanh từ điển

on:
  push:
    branches: [main]
    paths: ['index.html']        # mỗi lần sửa từ điển (thêm từ mới)
  schedule:
    - cron: '0 20 * * *'         # 3 giờ sáng giờ VN: thử lại các từ hôm trước bị lỗi
  workflow_dispatch:             # bấm "Run workflow" để chạy tay
    inputs:
      max_words:
        description: 'Số từ tối đa lần này (0 = tất cả, nhập 3 để nghe thử)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: tao-am-thanh
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gọi AI đọc các từ chưa có âm thanh
        run: python scripts/tao_am_thanh.py
        env:
          # ▼▼▼ DÁN 3 KHÓA API VÀO GIỮA HAI DẤU NHÁY ' ' (thay chữ DAN_KHOA_...) ▼▼▼
          FPT_KEY_BAC: 'oJGOGL5I3s09ZC5Poey7qG6ncXoVZZ5d'
          FPT_KEY_TRUNG: 'MAE61mhYfk7QmGjvozg4aBnqCBdKPqbd'
          FPT_KEY_NAM: 'C92DcLisZYayXrgVaxPPqkZjEnu8jYFl'
          # ▲▲▲ Chỉ sửa 3 dòng trên ▲▲▲
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
          # Mã giọng của FPT.AI — đổi tại đây nếu muốn giọng khác
          VOICE_BAC: banmai
          VOICE_TRUNG: ngoclam
          VOICE_NAM: linhsan
          MAX_WORDS: ${{ github.event.inputs.max_words || '0' }}

      - name: Lưu file âm thanh vào kho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add audio/tu-dien
          if git diff --cached --quiet; then
            echo "Không có file mới."
          else
            git commit -m "Thêm âm thanh từ điển (AI tự tạo)"
            git pull --rebase
            git push
          fi
