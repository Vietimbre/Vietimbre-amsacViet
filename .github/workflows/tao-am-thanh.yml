name: Tạo âm thanh từ điển

on:
  push:
    branches: [main]
    paths: ['index.html']        # mỗi lần sửa từ điển (thêm từ mới)
  schedule:
    - cron: '17 * * * *'         # mỗi giờ: làm tiếp các từ còn thiếu (đủ hết thì chạy vài giây là xong)
  workflow_dispatch:             # bấm "Run workflow" để chạy tay
    inputs:
      max_words:
        description: 'Số từ tối đa lần này (0 = tất cả, nhập 3 để nghe thử)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: tao-am-thanh
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gọi AI đọc các từ chưa có âm thanh
        run: python -u scripts/tao_am_thanh.py
        env:
          # ▼▼▼ DÁN TOKEN VIETTEL AI VÀO GIỮA HAI DẤU NHÁY ' ' (thay chữ DAN_KHOA_...) ▼▼▼
          VIETTEL_TOKEN: '2519a4645d07532be966b0079adc9276'
          # ▲▲▲ Chỉ sửa dòng trên ▲▲▲
          PROVIDER: viettel
          # Giọng Viettel AI — đổi tại đây nếu muốn giọng khác
          VIETTEL_VOICE_BAC: hn-quynhanh      # Bắc: hn-quynhanh, hn-thanhtung (nam), hn-thaochi...
          VIETTEL_VOICE_TRUNG: hue-maingoc    # Trung (Huế): hue-maingoc (nữ), hue-baoquoc (nam)
          VIETTEL_VOICE_NAM: hcm-thuyduyen    # Nam: hcm-thuyduyen (Thùy Duyên), hcm-diemmy, hcm-minhquan (nam)...
          MAX_WORDS: ${{ github.event.inputs.max_words || '0' }}

      - name: Lưu file âm thanh vào kho
        if: always()             # lưu cả phần đã xong dù bước trên lỗi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          mkdir -p audio/tu-dien
          git add audio/tu-dien
          if git diff --cached --quiet; then
            echo "Không có file mới."
          else
            git commit -m "Thêm âm thanh từ điển (AI tự tạo)"
            git pull --rebase
            git push
          fi
